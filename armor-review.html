<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Храбролап — 10 SVG-комплектов брони</title><style>
:root{font:15px system-ui,sans-serif;color:#513b31;background:#efe3d0}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:18px}h1{font:700 28px Georgia,serif;margin:0 0 10px}p{line-height:1.5}nav{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#fff5e6;border:2px solid #bc936b;border-radius:12px}select,button{font:inherit;padding:8px 12px;border-radius:8px;background:#fffaf0;border:1px solid #97775e;color:#513b31}label{display:flex;align-items:center;gap:8px}#sets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}.set{background:#fffaf1;border:2px solid #bc936b;border-radius:12px;overflow:hidden;text-align:center}.set h2{font-size:14px;margin:10px 4px 0;min-height:36px}.set svg{display:block;width:100%;height:auto}.note{font-size:13px;color:#765c49}a{color:#704a2f}@media(max-width:800px){#sets{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:480px){#sets{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:10px}h1{font-size:22px}}</style></head><body><main>
<h1>10 комплектов SVG-брони</h1><p>Шлем, нагрудник и обувь следуют за утверждёнными кадрами котёнка. Выбери атаку или получение урона и проверь каждую из шести поз.</p>
<nav><label>Анимация <select id="kind"><option value="attack">Атака</option><option value="hurt">Получение урона</option></select></label><label>Кадр <select id="frame"></select></label><button id="play">▶ Проиграть</button></nav>
<div id="sets"></div><p class="note">Цветок, лицо, шарфик, лапы, звёздочки и замах взяты из неизменённых исходных кадров. Броня — отдельные SVG-слои. <a href="equipment-preview.html">Примерка с мечами</a> · <a href="index.html">В игру</a></p>
</main><script type="module">
import {ARMORS} from './equipment-catalog.mjs';import {armorFramePath} from './armor-frames.mjs';import {CANONICAL_FRAME_PATHS} from './canonical-sprites.mjs';
const $=id=>document.getElementById(id);let timer=null;
for(let i=0;i<6;i++){const o=document.createElement('option');o.value=i;o.textContent=`${i+1} / 6`;$('frame').append(o);}
for(const a of ARMORS.filter(a=>a.svg)){const card=document.createElement('article');card.className='set';card.dataset.armor=a.id;const title=document.createElement('h2');title.textContent=a.name;card.append(title);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 279 370');svg.innerHTML='<image data-layer="body" width="279" height="370"/><image data-layer="armor" width="279" height="370"/>';card.append(svg);$('sets').append(card);}
function render(){const kind=$('kind').value,n=Number($('frame').value);for(const card of document.querySelectorAll('.set')){card.dataset.kind=kind;card.dataset.frame=n+1;card.querySelector('[data-layer="body"]').setAttribute('href',CANONICAL_FRAME_PATHS[kind][n]);card.querySelector('[data-layer="armor"]').setAttribute('href',armorFramePath(card.dataset.armor,kind,n));}}
for(const id of ['kind','frame'])$(id).onchange=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Проиграть';}render();};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Проиграть';return;}timer=setInterval(()=>{$('frame').value=(Number($('frame').value)+1)%6;render();},160);$('play').textContent='⏸ Пауза';};render();
</script></body></html>
