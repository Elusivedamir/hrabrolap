<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#303b40"><title>Храбролап — Тихая пристань v0.9.7 · 10 монстров</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game" id="game" aria-label="Игра Храбролап">
<header class="hud"><div class="brand"><img src="art/icons/house.svg" alt=""/><div><b>ХРАБРОЛАП</b><small>ТИХАЯ ПРИСТАНЬ · 2D</small></div></div><div class="wallet"><img src="art/icons/coin.svg" alt=""/><div><b id="gold">0</b></div></div><button id="inventory" class="hud-action" aria-label="Инвентарь"><img src="art/icons/inventory-bag.svg" alt=""/></button><button id="shop" class="hud-action" aria-label="Магазин"><img src="art/icons/shop-sign.svg" alt=""/></button></header>
<section class="surface" id="surface" aria-label="Уютная пристань и домик">
 <img class="scene-art" src="art/animated/port_active_clean.webp" alt="Рыцарь-человек в закрытом шлеме рыбачит у домика"/>
 <img class="house-cutaway" src="art/animated/port_rest_empty_attic.png" alt="Тот же домик с раскрытым интерьером во время отдыха"/>
 <img id="rest-sleep-sprite" class="rest-sleep-sprite" src="assets/rest/sleep_01.png" alt="Котёнок спит без брони и меча в существующем доме" aria-hidden="true"/>
 
 <div class="rest-label" id="rest-label">Храбролап отдыхает дома</div><img class="mini-cave" src="art/scenery/cave.svg" alt="Вход в подземелье"/><img class="mini-shop" id="mini-shop" src="art/scenery/shop.svg" alt="Магазин у дома"/><span class="cave-call" id="cave-call">Мы справимся!</span><img class="cave-runner" src="art/hero/bare-kitten.svg" alt="Храбролап идёт к пещере"/>
 <span class="knight" id="knight" aria-label="Большой рыцарь-рыбак изображён на рисованном фоне"></span>
 <svg class="fishing-rig" id="fishing-rig" viewBox="0 0 540 362" aria-label="Удочка и поплавок в воде" xmlns="http://www.w3.org/2000/svg">
  <g class="rod-group" id="rod-group"><path d="M143 258Q103 205 70 158Q51 136 45 130" stroke="#624b40" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M143 258Q103 205 70 158Q51 136 45 130" stroke="#e1b77c" stroke-width="2" stroke-linecap="round" fill="none"/></g>
  <path id="fishing-line" d="M45 130Q49 207 66 273" stroke="#fff4d3" stroke-width="2" fill="none"/>
  <g class="bobber" id="bobber"><ellipse cx="66" cy="276" rx="10" ry="4" fill="#d6fff6" opacity=".45"/><path d="M60 273Q58 262 66 258Q74 260 72 274Z" fill="#f8faf1" stroke="#7b5953" stroke-width="2"/><path d="M60 270Q66 268 73 270V275Q66 279 60 275Z" fill="#dd6f65"/><path d="M66 257V252" stroke="#5f6c65" stroke-width="2"/></g>
  <g id="fish-splash" class="fish-splash"><path d="M34 275Q51 253 65 277Q81 258 98 275" fill="none" stroke="#ecfff4" stroke-width="4" stroke-linecap="round"/><circle cx="52" cy="252" r="3" fill="#f6fff2"/><circle cx="81" cy="252" r="3" fill="#f6fff2"/></g>
 </svg>
  <img id="fishing-animation" class="fishing-anim-overlay" src="animations/fishing/01.svg" alt="Рыцарь-рыбак: десятикадровая анимация заброса, подсечки и помещения рыбы в ведро"/>
 <img class="fish-flight" src="art/fish.svg" alt="Пойманная рыба летит в ведро"/>
 <button class="bucket" id="bucket" aria-label="Открыть ведро с рыбой"><img id="bucket-graphic" src="art/scenery/bucket-empty.svg" alt="Ведро для рыбы"/><span id="bucket-indicator">0 рыб</span></button>
 <button class="merchant" id="merchant" aria-label="Рыбный торговец"><img src="art/merchant.svg" alt="Седой кот-торговец"/><span id="merchant-bubble">Хей, ребята привет, есть что-то для меня?</span><small id="merchant-visit">00:15</small></button>
 <div class="top-status"><span id="fish-status">Рыбак ждёт первую поклёвку</span><span id="merchant-status">Торговец через 05:00</span></div>
</section>
<section class="dungeon" aria-label="Автоматические бои в подземелье"><img class="scene-art" src="art/approved/dungeon_comic.webp" alt="Иллюстрированное подземелье"/>
 <div class="dungeon-title"><div class="room-mark"><small>ПОДЗЕМЕЛЬЕ · 100 ВОЛН</small><b id="room">ВОЛНА 1/100</b></div><div class="auto-controls"><button type="button" id="status" class="battle-status" aria-label="Купить автобой за одну монету и переключать режим боя">АВТОБОЙ · 1 🪙</button></div></div>
 <div class="arena"><div class="fighter hero-fighter"><div class="health-title"><span>Храбролап</span><span id="hero-hp-num">60/60</span></div><div id="hero-hearts" class="hero-hearts" role="img" aria-label="Здоровье Храбролапа сердечками"></div><div class="health-bar legacy-hero-hp"><div id="hero-hp" class="hp-green"></div></div>
 <div id="hero-art" class="hero-art"><svg id="hero-rig" class="hero-rig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 305" aria-label="Храбролап с отдельными SVG-мечом и бронёй"><g id="hero-motion"><image id="hero-body" href="assets/canonical/attack_01.png" x="114" y="-22" width="260" height="346"/><g id="armor-slot" transform="translate(0 0) rotate(0 236 243)"><image id="hero-armor" href="art/armor/steel.svg" x="190" y="212" width="92" height="63" style="display:none"/></g><defs><clipPath id="forest-front-clip" clipPathUnits="userSpaceOnUse"><path id="forest-front-path" d=""/></clipPath></defs><image id="forest-armor" href="" x="114" y="-22" width="260" height="346" style="display:none;pointer-events:none"/><image id="forest-front" href="" x="114" y="-22" width="260" height="346" clip-path="url(#forest-front-clip)" style="display:none;pointer-events:none"/><g id="weapon-slot" transform="translate(170 229) rotate(-20)"><image id="hero-weapon" href="art/weapons/iron.svg" x="-50" y="-211" width="100" height="240"/></g></g></svg></div></div>
 <div class="vs">✦</div><div class="fighter monster-fighter"><div class="health-title"><span id="enemy-name">Слизень</span><span id="enemy-hp-num">20/20</span></div><div id="enemy-hearts" class="hero-hearts enemy-hearts" role="img" aria-label="Здоровье монстра сердечками"></div><div class="health-bar legacy-monster-hp" aria-hidden="true"><div id="enemy-hp" class="hp-red"></div></div><div class="enemy-holder" id="enemy-holder" role="button" tabindex="0" aria-label="Атаковать монстра вручную"><img id="enemy-art" class="monster-art" src="art/slime.svg" alt="Монстр"/><span class="enemy-effect" id="enemy-effect"></span></div><img id="boss-crown" class="boss-crown" src="art/approved/crown.svg" alt="Корона босса"/></div></div>
 <div class="battle-message" id="battle-message">Котёнок сражается самостоятельно</div><div class="progress-track"><span>ПРОГРЕСС</span><div class="rail"><div id="room-fill"></div></div><span id="room-progress">0/100</span></div>
</section>
<section class="upgrades"><div class="upgrade-head"><b>УЛУЧШЕНИЯ</b><div><button id="quests" class="plain-btn">📜 Задания</button><button id="help" class="plain-btn">?</button></div></div>
 <div class="upgrade-grid">
 <button id="buy-sword" class="upgrade-card"><img src="art/icons/sword.svg" alt=""/><span><b>Меч <small id="sword-lvl">ур. 0</small></b><small id="sword-stat">Урон 6→8</small><strong id="sword-cost">🪙 20</strong></span></button>
 <button id="buy-armor" class="upgrade-card"><img src="art/icons/armor.svg" alt=""/><span><b>Броня <small id="armor-lvl">ур. 0</small></b><small id="armor-stat">HP 60→72</small><strong id="armor-cost">🪙 35</strong></span></button>
 <button id="buy-fish" class="upgrade-card"><img src="art/icons/fishing.svg" alt=""/><span><b>Удочка <small id="fish-lvl">ур. 0</small></b><small>Более ценный улов</small><strong id="fish-cost">🪙 45</strong></span></button>
 <button id="buy-home" class="upgrade-card"><img src="art/icons/house.svg" alt=""/><span><b>Домик <small id="home-lvl">ур. 0</small></b><small>Быстрее отдых</small><strong id="home-cost">🪙 65</strong></span></button>
 <button id="buy-attack-speed" class="upgrade-card attack-speed-card" aria-label="Улучшить скорость автоатаки"><img src="art/icons/attack-speed.svg" alt=""/><span><b>Скорость автоатаки <small id="attack-speed-lvl">ур. 0/100</small></b><small id="attack-speed-stat">Автоатака: 1 удар/с</small><strong id="attack-speed-cost">🪙 12</strong></span></button>
 </div><div class="footnote"><span>● Автосохранение · v0.9.7 · защищённые анимации</span><button id="reset" class="plain-btn">Сброс</button></div>
</section>
<div id="toast" class="toast" aria-live="polite"></div>
<dialog class="modal" id="modal"><section class="modal-card"><button class="modal-x" id="modal-x" aria-label="Закрыть">×</button><h2 id="modal-title"></h2><div class="modal-content" id="modal-content"></div><div id="modal-buttons" class="modal-buttons"></div></section></dialog>
</main><script type="module" src="game.mjs"></script></body></html>
