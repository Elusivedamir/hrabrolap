<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лесной страж · покадровая приёмка</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f2e6cf;color:#302216;margin:0;padding:18px}
h1{font-size:22px;margin:0 0 12px}p{line-height:1.5}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
button{padding:10px 16px;border:1px solid #a48f70;background:#fff8ea;border-radius:8px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cell{background:#fff7e9;border:1px solid #d7c3a2;border-radius:10px;overflow:hidden;text-align:center}
.cell svg{display:block;width:100%;height:auto;aspect-ratio:279/370}
.caption{padding:8px;font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><h1>Лесной страж · 50 монет</h1><p>12 кадров исходного котёнка и отдельного слоя брони. Нажмите, чтобы сравнить. Лапы остаются фрагментами оригинального кадра.</p><div class="tools"><button id="toggle">Снять броню</button><button id="zoom">Увеличить</button><a href="index.html">В игру</a></div><section id="grid" class="grid"></section>
<script type="module">
import {forestArmorUrl,forestForegroundPath} from './forest-guardian-rig.mjs';
const ns='http://www.w3.org/2000/svg',g=document.getElementById('grid');
let shown=true,zoom=false;
function el(tag,props={}){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(props))n.setAttribute(k,String(v));return n}
for(const kind of ['attack','hurt'])for(let i=0;i<6;i++){
 const cell=document.createElement('div');cell.className='cell';
 const svg=el('svg',{viewBox:'0 0 279 370',role:'img','aria-label':kind+' '+(i+1)});
 const defs=el('defs'),cp=el('clipPath',{id:'forest-clip-'+kind+'-'+i,clipPathUnits:'userSpaceOnUse'});
 cp.append(el('path',{d:forestForegroundPath(kind,i,{x:0,y:0,width:279,height:370})}));defs.append(cp);svg.append(defs);
 const base='assets/canonical/'+kind+'_'+String(i+1).padStart(2,'0')+'.png';
 svg.append(el('image',{href:base,x:0,y:0,width:279,height:370}));
 const armor=el('image',{href:forestArmorUrl(kind,i),x:0,y:0,width:279,height:370,'data-forest':'1'});svg.append(armor);
 const head=el('image',{href:base,x:0,y:0,width:279,height:370,'clip-path':'url(#forest-clip-'+kind+'-'+i+')','data-forest':'1'});svg.append(head);
 cell.append(svg);const caption=document.createElement('div');caption.className='caption';caption.textContent=(kind==='attack'?'Атака ':'Урон ')+(i+1);cell.append(caption);g.append(cell);
}
document.getElementById('toggle').onclick=()=>{
 shown=!shown;for(const n of document.querySelectorAll('[data-forest]'))n.style.display=shown?'':'none';
 document.getElementById('toggle').textContent=shown?'Снять броню':'Надеть броню';
};
document.getElementById('zoom').onclick=()=>{zoom=!zoom;g.style.gridTemplateColumns=zoom?'repeat(2,minmax(0,1fr))':'';};
</script></body></html>
