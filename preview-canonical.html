<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Храбролап • Исходные кадры</title>
<style>:root{font-family:system-ui,sans-serif;background:#252733;color:#fff5dd}*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:auto;padding:16px}h1{font:800 clamp(20px,4vw,31px) Georgia,serif}p{line-height:1.4;color:#d6d1ca}.panel{background:#38313b;border:2px solid #b78b68;padding:13px;border-radius:15px}.controls{display:flex;flex-wrap:wrap;gap:8px}button,select{padding:9px 12px;border-radius:9px;color:#392c2b;background:#fae3bb;border:0;cursor:pointer;font-size:15px}button:focus-visible,select:focus-visible{outline:3px solid gold}.stage{min-height:250px;background:radial-gradient(ellipse at center,#76748a,#343240);border-radius:12px;display:grid;place-items:center;margin:12px auto;overflow:hidden}svg{width:min(100%,650px);max-height:440px}.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.frames button{background:#6a6071;border:2px solid #927d83;display:flex;flex-direction:column;align-items:center;color:white;padding:2px}.frames button.selected{border-color:#ffc56f}.frames img{width:100%;height:140px;object-fit:contain}label{display:grid;font-size:12px;gap:5px;color:#f7d6ac}small{color:#c6bcb5}.note{font-size:13px}</style></head><body>
<main><h1>Храбролап • Канонические кадры</h1><p>Оригинальные кадры вырезаны из утверждённых исходников, не перерисованы. Сменное оружие и броня — независимые SVG-слои.</p>
<div class="panel"><div class="controls"><label>Анимация<select id="kind"><option value="attack">Атака (6 кадров)</option><option value="hurt">Получение урона (6 кадров)</option></select></label><label>Меч<select id="weapon"><option value="iron">Железный меч</option><option value="fishbone">Рыбий позвоночник</option><option value="none">Без меча</option></select></label><label>Броня<select id="armor"><option value="none">Без брони</option><option value="web">Паутинная броня</option></select></label><button id="play">▶ Анимация</button></div>
<div class="stage"><svg id="rig" viewBox="0 0 488 305" xmlns="http://www.w3.org/2000/svg"><g id="hero-motion"><image id="hero-body" href="assets/canonical/attack_01.png" x="114" y="-22" width="260" height="346"/><g id="armor-slot"><image id="hero-armor" href="art/armor/web.svg" style="display:none"/></g><g id="weapon-slot"><image id="hero-weapon" x="-50" y="-211" width="100" height="240" href="art/weapons/iron.svg"/></g></g></svg></div>
<div id="frames" class="frames"></div><p class="note">На этом экране можно оценить фактическое движение кадров и расположение слоёв. Это контрольный стенд, не новая игра.</p></div>
</main><script type="module">
import {applyCanonicalFrame,CANONICAL_FRAME_PATHS} from './canonical-sprites.mjs';
const $=id=>document.getElementById(id);let current=0,interval=null;
const rig={body:$('hero-body'),heroMotion:$('hero-motion'),weaponSlot:$('weapon-slot'),armorSlot:$('armor-slot'),armorImage:$('hero-armor')};
function render(){applyCanonicalFrame($('kind').value,current,rig);$('hero-armor').style.display=$('armor').value==='none'?'none':'';$('hero-weapon').style.display=$('weapon').value==='none'?'none':'';if($('weapon').value!=='none')$('hero-weapon').setAttribute('href','art/weapons/'+$('weapon').value+'.svg');document.querySelectorAll('.frames button').forEach((el,i)=>el.classList.toggle('selected',current===i));}
function buildThumbs(){const box=$('frames');box.replaceChildren();CANONICAL_FRAME_PATHS[$('kind').value].forEach((src,i)=>{const b=document.createElement('button');b.textContent='Кадр '+(i+1);const im=document.createElement('img');im.src=src;b.append(im);b.onclick=()=>{current=i;render();};box.append(b);});}
for(const id of ['kind','armor','weapon'])$(id).onchange=()=>{current=0;buildThumbs();render();};
$('play').onclick=()=>{if(interval){clearInterval(interval);interval=null;$('play').textContent='▶ Анимация';return;}interval=setInterval(()=>{current=(current+1)%6;render();},135);$('play').textContent='⏸ Пауза';};
buildThumbs();render();
</script></body></html>
