name: Install approved knight costume
on:
  push:
    paths:
      - 'incoming/approved_knight.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-knight-import-main
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Check approved art archive exists
        id: file
        run: |
          if [ -f incoming/approved_knight.zip ]; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - name: Install exactly twelve approved kitten animations
        if: steps.file.outputs.exists == 'true'
        run: python3 tools/install_approved_knight.py
      - uses: actions/setup-node@v4
        if: steps.file.outputs.exists == 'true'
        with:
          node-version: '22'
      - name: Install test dependencies
        if: steps.file.outputs.exists == 'true'
        run: |
          npm ci --ignore-scripts
          python3 -m pip install Pillow==11.3.0
      - name: Run game unit tests
        if: steps.file.outputs.exists == 'true'
        run: npm test
      - name: Publish approved character animations to main
        if: steps.file.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/costumes/steel_knight equipment-catalog.mjs
          if ! git diff --cached --quiet; then
            git commit -m "art: install 12 approved Golden Knight full-character frames"
            git push origin HEAD:main
          fi
