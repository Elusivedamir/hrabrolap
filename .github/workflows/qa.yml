name: Hrabrolap QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install Pillow==11.3.0
      - run: npm test
      - run: npm run qa:balance
      - run: npx playwright install --with-deps chromium
      - name: Real mobile Chromium tests
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/hrabrolap-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 - <<'PY'
          import urllib.request,time
          for _ in range(50):
            try:
              urllib.request.urlopen('http://127.0.0.1:8080/', timeout=1)
              break
            except OSError:
              time.sleep(.1)
          else:
            raise RuntimeError('Game HTTP server did not start')
          PY
          npm run qa:browser
          npm run qa:armor-designs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrabrolap-qa
          path: qa/

      - name: Package tested HTML5 build
        if: success()
        run: |
          python3 tools/package_game.py hrabrolap-v0.9.7-visual-review.zip
      - name: Upload playable HTML5 ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hrabrolap-v0.9.7
          path: hrabrolap-v0.9.7-visual-review.zip

      - name: Publish v0.9.7 tag after successful main QA
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ "$(node -p "require('./package.json').version")" != "0.9.7" ]; then
            echo "Skip tagging: release version is not 0.9.7"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.9.7 >/dev/null 2>&1; then
            echo "v0.9.7 tag already exists; leave it unchanged"
            exit 0
          fi
          git tag v0.9.7
          git push origin refs/tags/v0.9.7
