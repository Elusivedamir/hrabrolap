name: Export Forest Guardian manual editing kit
on:
  push:
    paths:
      - '.github/workflows/export-forest-manual-kit.yml'
      - 'tools/export_forest_manual_kit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Copy exact originals, overlays and build editable layered PSD files
        run: python tools/export_forest_manual_kit.py
      - name: Publish ready-to-download kit into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/forest_guardian_manual_kit.zip
          if ! git diff --cached --quiet; then
            git commit -m "art: package 12 original kitten and armor PSD editing pairs [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: forest-guardian-manual-kit
          path: downloads/forest_guardian_manual_kit.zip
          retention-days: 30
