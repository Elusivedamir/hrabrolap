name: Prepare transparent kitten sprites
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/prepare_transparent_sprites.py'
      - '.github/workflows/prepare-transparent-sprites.yml'
      - 'assets/costumes/forest_guardian/**'
      - 'assets/costumes/steel_knight/**'
permissions:
  contents: write
concurrency:
  group: transparent-kitten-sprites
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Bake 36 transparent sprites, keeping originals untouched
        run: python tools/prepare_transparent_sprites.py
      - name: Verify all frames and alpha, no original modifications
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ('canonical','forest_guardian','steel_knight'):
              for kind in ('attack','hurt'):
                  for i in range(1,7):
                      p=Path('assets/clean')/name/f'{kind}_{i:02}.png'
                      with Image.open(p) as im:
                          assert im.mode=='RGBA' and im.getbbox(),p
                          assert im.getpixel((0,0))[3]==0,p
          print('All 36 cleaned animations verified')
          PY
      - name: Commit transparent copies to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clean/
          if ! git diff --cached --quiet; then
            git commit -m "art: transparent sprite copies for canonical, Forest Guardian and Golden Knight [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
