name: Bake five kitten costume sets
on:
  push:
    paths:
      - 'tools/generate_baked_costumes.py'
      - '.github/workflows/bake-costumes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install drawing dependencies
        run: python -m pip install Pillow==11.3.0 numpy==2.3.3 cairosvg==2.8.2
      - name: Bake complete costume sprites
        run: python tools/generate_baked_costumes.py
      - name: Check all sixty PNG frames
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names=['steel_knight','thorn_ranger','moon_mage','ember_guard','frost_watcher']
          for name in names:
              for kind in ('attack','hurt'):
                  for i in range(1,7):
                      file=Path('assets/costumes')/name/f'{kind}_{i:02}.png'
                      with Image.open(file) as image:
                          assert image.size==(279,370) and image.mode=='RGBA',file
          print('Verified 60/60 complete-character PNGs')
          PY
      - name: Commit generated complete-character assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/costumes/steel_knight assets/costumes/thorn_ranger assets/costumes/moon_mage assets/costumes/ember_guard assets/costumes/frost_watcher
          if ! git diff --cached --quiet; then
            git commit -m "art: bake 60 complete-costume kitten PNG frames [skip ci]"
            git push origin HEAD:main
          fi
