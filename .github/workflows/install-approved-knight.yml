name: Install approved Golden Knight
on:
  push:
    branches: [main]
    paths:
      - downloads/approved_knight_source.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Import approved integrated kitten (12 PNGs, not an overlay)
        run: python tools/import_approved_knight.py
      - run: npm ci --ignore-scripts
      - name: Core QA
        run: npm test
      - name: Commit completed costume to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/costumes/approved_knight equipment-catalog.mjs canonical-sprites.mjs tests/baked-costumes.test.mjs tests/loot.test.mjs tests/equipment-rig.test.mjs tests/browser.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "feat: add user-approved Golden Knight complete costume for 50 coins [skip ci]"
            git push origin HEAD:main
          fi
