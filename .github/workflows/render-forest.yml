name: Render Forest Guardian artwork
on:
  push:
    branches: [main]
    paths:
      - tools/refine_forest_guardian.py
      - .github/workflows/render-forest.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Repaint twelve frames without restoring opaque background
        run: python tools/refine_forest_guardian.py
      - name: Verify masks, image sizes and transparency
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('assets/clean/forest_guardian')
          assert (root/'refined-v2.txt').exists()
          for kind in ['attack','hurt']:
            for i in range(1,7):
              im=Image.open(root/f'{kind}_{i:02}.png').convert('RGBA')
              assert im.size in [(279,370),(558,740)]
              assert im.getpixel((0,0))[3]==0
          print('PASS: 12 alpha-preserving armor frames')
          PY
      - name: Commit cleaned frames back to main
        run: |
          git add assets/clean/forest_guardian/
          if git diff --cached --quiet; then
            echo "Already published"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art: publish twelve refined Forest Guardian frames [skip ci]"
          git push origin HEAD:main
