<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Храбролап — новый кот-торговец</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px 12px;background:linear-gradient(#263f4a,#142a38);color:#ffeccc;font-family:system-ui,sans-serif}main{max-width:940px;margin:auto}h1{font-size:clamp(20px,5vw,30px);margin:0 0 6px}p{color:#decbb7;font-size:14px}.demo{border:2px solid #80624a;border-radius:18px;background:radial-gradient(circle at center,#536b5a,#283b3a);min-height:270px;display:flex;gap:8px;justify-content:center;align-items:center;flex-direction:column;padding:14px}.demo img{width:170px;height:207px;object-fit:contain;filter:drop-shadow(0 7px 5px #182d2c80)}.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}button{border:1px solid #aa8359;border-radius:10px;background:#876544;color:#fff1d8;font-size:13px;padding:9px 10px;cursor:pointer}.controls button.active{background:#578e68;border-color:#bfe1a6}h2{font-size:18px;color:#ffe4a3;margin:22px 0 10px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.frame{border:1px solid #596878;border-radius:8px;background:#294251;text-align:center}.frame img{width:100%;height:auto;aspect-ratio:210/255;object-fit:contain;display:block}.frame span{font-size:12px;color:#efc9a1;padding:3px;display:block}@media(max-width:440px){.frame span{font-size:10px}.grid{gap:2px}}
</style></head><body><main><h1>Серый кот-торговец · Храбролап</h1><p>18 кадров одной модели: 6 приход, 6 ожидание, 6 уход. Все кадры — прозрачные SVG с едиными пропорциями.</p><section class="demo"><img id="current" alt="Новый серый кот-торговец с корзиной рыбы"/><div class="controls"><button data-phase="arrive">Приход</button><button data-phase="idle" class="active">Ожидание</button><button data-phase="leave">Уход</button></div></section><div id="gallery"></div></main><script type="module">
import{merchantFrameUrl}from './merchant-sprites.mjs';
const names={arrive:'Приход',idle:'Ожидание',leave:'Уход'};
for(const phase of ['arrive','idle','leave']){
 const title=document.createElement('h2');title.textContent=names[phase]+' — 6 кадров';document.querySelector('#gallery').append(title);
 const grid=document.createElement('div');grid.className='grid';
 for(let i=0;i<6;i++){const card=document.createElement('div');card.className='frame';const img=document.createElement('img');img.src=merchantFrameUrl(phase,i);img.alt=`${names[phase]} кадр ${i+1}`;const cap=document.createElement('span');cap.textContent=String(i+1);card.append(img,cap);grid.append(card);}document.querySelector('#gallery').append(grid);
}
let phase='idle',frame=0;
const current=document.querySelector('#current');
function show(){current.src=merchantFrameUrl(phase,frame);frame=(frame+1)%6}
function tick(){show();setTimeout(tick,phase==='idle'?400:120)}tick();
for(const button of document.querySelectorAll('button[data-phase]'))button.addEventListener('click',()=>{phase=button.dataset.phase;frame=0;document.querySelectorAll('button[data-phase]').forEach(b=>b.classList.toggle('active',b===button));show()});
</script></body></html>
