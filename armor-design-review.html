<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 отдельных комплектов SVG-брони</title><style>body{margin:0;padding:22px;background:#f0e5d1;color:#51392d;font-family:Georgia,serif}h1{margin:0 0 8px;font-size:30px}header p{margin:0 0 16px;line-height:1.45}main{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}article{border:2px solid #b9916c;border-radius:12px;background:#fffaf1;padding:10px 8px;display:flex;flex-direction:column;align-items:center}h2{margin:3px 0;font-size:16px;min-height:36px;text-align:center}img{display:block;width:100%;aspect-ratio:360/440;object-fit:contain}article p{font-size:12px;line-height:1.35;margin:8px 4px 10px;flex:1}a{color:#7b4c2a;font-size:13px}footer{font-size:13px;padding-top:14px}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:12px}} </style><header><h1>10 комплектов SVG-брони</h1><p>Отдельные эскизы для согласования: головной убор, одежда с плечами и рукавами, обувь.<br>В анимацию пока не установлены. Каждый SVG — прозрачный, с редактируемыми группами деталей.</p></header><main></main><footer>Следующий этап — выбор и подгонка каждого комплекта под утверждённые кадры котёнка.</footer><script type="module">const sets=await(await fetch('art/armor-designs/manifest.json')).json();for(const s of sets){const a=document.createElement('article');a.dataset.armor=s.id;a.innerHTML=`<h2>${s.name}</h2><img src="${s.file}" alt="${s.name}"><p>${s.description}</p><a href="${s.file}" download="${s.id}.svg">Скачать SVG</a>`;document.querySelector('main').append(a);}await Promise.all([...document.images].map(i=>i.decode()));window.designsReady=true;</script></html>
